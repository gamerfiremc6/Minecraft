<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Don't Block Me Quiz (King Kohli #18 Special)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    :root { --bg-sky:#d7efff; --card-bg:#fff; --primary-blue:#2c7be5; --accent-pink:#ff6584; --accent-yellow:#ffc93c; --accent-green:#38b000; --accent-red:#d90429; --text-dark:#2d3748; --border-blue:#b3d7ff; }
    * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; user-select:none; }
    body { font-family:'Fredoka','Nunito',sans-serif; background:linear-gradient(180deg,#bfe3fc 0%,#e3f4ff 100%); min-height:100vh; display:flex; justify-content:center; align-items:flex-start; padding:14px 10px 40px; color:var(--text-dark); overflow-x:hidden; }
    .app-wrapper { width:100%; max-width:440px; background:#fdfdfd; border-radius:36px; padding:18px 16px 26px; box-shadow:0 16px 40px rgba(71,148,235,.22); border:4px solid #fff; position:relative; }
    .top-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; padding:0 4px; }
    .brand-tag { font-weight:700; font-size:13px; background:#e6f4ff; color:var(--primary-blue); padding:6px 14px; border-radius:20px; display:inline-flex; align-items:center; gap:6px; box-shadow:0 2px 6px rgba(0,0,0,.05); }
    .sound-btn { background:#fff; border:2px solid var(--border-blue); padding:6px 12px; border-radius:20px; font-size:13px; font-weight:700; cursor:pointer; color:var(--text-dark); display:flex; align-items:center; gap:5px; box-shadow:0 2px 8px rgba(0,0,0,.05); }
    .progress-bar-wrap { display:flex; gap:4px; overflow-x:auto; padding:6px 2px 10px; scrollbar-width:none; -ms-overflow-style:none; }
    .progress-bar-wrap::-webkit-scrollbar { display:none; }
    .pill { min-width:26px; height:26px; border-radius:50%; background:#e6f0fa; color:#7b8fa3; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; flex-shrink:0; transition:all .2s ease; }
    .pill.active { background:var(--primary-blue); color:#fff; transform:scale(1.18); box-shadow:0 3px 8px rgba(44,123,229,.35); }
    .pill.correct { background:#52b788; color:white; } .pill.wrong { background:var(--accent-pink); color:white; }
    .mascot-area { text-align:center; margin:8px 0 12px; position:relative; }
    .mascot-bubble { display:inline-block; width:86px; height:86px; border-radius:50%; background:#fff0f3; border:3px dashed #ffb3c1; padding:6px; position:relative; animation:floatMascot 2.5s ease-in-out infinite alternate; }
    @keyframes floatMascot { from{transform:translateY(0) rotate(-2deg)} to{transform:translateY(-7px) rotate(2deg)} }
    .mascot-emoji { font-size:52px; line-height:74px; display:block; }
    .question-card { background:#fff; border:2px dashed #90caf9; border-radius:26px; padding:16px 14px 18px; text-align:center; position:relative; box-shadow:0 6px 16px rgba(0,87,184,.06); margin-bottom:16px; }
    .tape { position:absolute; top:-10px; left:50%; transform:translateX(-50%); width:70px; height:18px; background:rgba(255,179,193,.7); border-radius:3px; }
    .badge-no { display:inline-block; background:var(--accent-yellow); color:#573a08; font-weight:800; font-size:11px; padding:3px 14px; border-radius:12px; text-transform:uppercase; margin-bottom:6px; margin-top:4px; }
    .question-title { font-size:19px; font-weight:800; color:#1a202c; line-height:1.35; } .question-title span { color:var(--accent-pink); }
    .options-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .option-card { background:#fff; border:2.5px solid #e2e8f0; border-radius:20px; padding:16px 8px; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; transition:transform .15s,border-color .2s,box-shadow .2s; box-shadow:0 4px 12px rgba(0,0,0,.04); min-height:130px; }
    .option-card:hover { border-color:var(--border-blue); transform:translateY(-2px); } .option-card:active { transform:scale(.96); }
    .option-card.chosen-correct { background:#e8f5e9!important; border-color:var(--accent-green)!important; box-shadow:0 0 16px rgba(56,176,0,.4); animation:popAnim .3s ease; }
    .option-card.chosen-wrong { background:#ffebee!important; border-color:var(--accent-red)!important; box-shadow:0 0 16px rgba(217,4,41,.4); animation:shakeAnim .35s ease; }
    @keyframes popAnim { 0%{transform:scale(.95)} 60%{transform:scale(1.06)} 100%{transform:scale(1)} }
    @keyframes shakeAnim { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-6px)} 40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)} }
    .opt-icon { font-size:42px; margin-bottom:8px; display:block; } .opt-label { font-size:15px; font-weight:800; color:#334155; text-align:center; line-height:1.25; }
    .meme-snack { display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:rgba(15,23,42,.92); color:#fff; padding:14px 24px; border-radius:50px; font-size:18px; font-weight:800; z-index:100; border:3px solid var(--accent-yellow); animation:popMeme .8s ease forwards; pointer-events:none; text-align:center; max-width:85%; box-shadow:0 10px 30px rgba(0,0,0,.4); }
    @keyframes popMeme { 0%{opacity:0;transform:translate(-50%,-40%) scale(.7)} 25%{opacity:1;transform:translate(-50%,-50%) scale(1.1)} 75%{opacity:1;transform:translate(-50%,-50%) scale(1)} 100%{opacity:0;transform:translate(-50%,-60%) scale(.9)} }
    .result-container { display:none; text-align:center; padding-top:10px; }
    .score-circle { width:140px; height:140px; border-radius:50%; background:linear-gradient(135deg,#ffc93c,#ff9f1c); color:white; display:flex; flex-direction:column; align-items:center; justify-content:center; margin:12px auto 16px; border:5px solid white; box-shadow:0 10px 24px rgba(255,159,28,.35); }
    .score-main { font-size:40px; font-weight:900; line-height:1; } .score-sub { font-size:13px; font-weight:700; opacity:.9; }
    .verdict-title { font-size:24px; font-weight:900; color:#1e293b; margin-bottom:6px; } .verdict-desc { font-size:15px; color:#64748b; line-height:1.4; margin-bottom:22px; padding:0 12px; font-weight:600; }
    .btn-action { background:var(--primary-blue); color:white; border:none; padding:14px 20px; border-radius:18px; font-size:16px; font-weight:800; width:100%; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:10px; box-shadow:0 6px 18px rgba(44,123,229,.3); transition:transform .1s; }
    .btn-action:active { transform:scale(.97); } .btn-whatsapp { background:#25d366; box-shadow:0 6px 18px rgba(37,211,102,.3); } .btn-retry { background:#f1f5f9; color:#475569; box-shadow:none; border:2px solid #cbd5e1; }
  </style>
</head>
<body>
<div class="app-wrapper">
  <div class="top-bar">
    <div class="brand-tag"><span>👑</span> Jersey #18 Edition</div>
    <button class="sound-btn" id="soundToggle" onclick="toggleAudio()"><span id="soundIcon">🔊</span> Sound: ON</button>
  </div>
  <div id="quizScreen">
    <div class="progress-bar-wrap" id="progressBar"></div>
    <div class="mascot-area"><div class="mascot-bubble"><span class="mascot-emoji" id="mascotFace">🐻</span></div></div>
    <div class="question-card">
      <div class="tape"></div>
      <span class="badge-no" id="questionBadge">Question 1 / 18</span>
      <h2 class="question-title" id="questionText">Loading question...</h2>
    </div>
    <div class="options-grid" id="optionsContainer"></div>
  </div>
  <div id="resultScreen" class="result-container">
    <div class="mascot-area"><div class="mascot-bubble" style="background:#e0f2fe;border-color:#7dd3fc;"><span class="mascot-emoji" id="resultEmoji">🏆</span></div></div>
    <div class="score-circle"><div class="score-main" id="finalScoreVal">0</div><div class="score-sub">OUT OF 18</div></div>
    <h2 class="verdict-title" id="verdictHeading">Loading...</h2>
    <p class="verdict-desc" id="verdictText">Verdict details...</p>
    <button class="btn-action btn-whatsapp" onclick="shareOnWhatsApp()"><span>📲</span> Share Result on WhatsApp</button>
    <button class="btn-action btn-retry" onclick="restartQuiz()"><span>🔄</span> Play Again</button>
  </div>
</div>
<div class="meme-snack" id="memeAlert">Boom! 🔥</div>
<script>
const quizData = [
 {q:"Subah school/class me konsi bench pe baithna pasand hai?",a:{text:"Front Bench 🤓",icon:"📚",isCorrect:false,meme:"Padhaku ban raha hai? 😂"},b:{text:"Last Bench (Legends) 😎",icon:"👑",isCorrect:true,meme:"Arre Backbencher Bhai! 🤝"}},
 {q:"Gully cricket me sabse pehle kya rule lagta hai?",a:{text:"Batting meri, bat mera! 🏏",icon:"🔥",isCorrect:true,meme:"Ye toh national rule hai! 🤣"},b:{text:"Fair play & rule follow 😇",icon:"🕊️",isCorrect:false,meme:"Jhooth mat bol! 💀"}},
 {q:"Shaam ko bhookh lagi toh pehli pasand?",a:{text:"Garam Vada Pav 🥯",icon:"🌶️",isCorrect:true,meme:"Swaad aa gaya boss! 🤤"},b:{text:"Fancy Salad 🥗",icon:"🥦",isCorrect:false,meme:"Aayein? Baingan! 🍆"}},
 {q:"WhatsApp/Insta par message bhejne ka style?",a:{text:"10 tukdo me chote messages 💬",icon:"📲",isCorrect:true,meme:"Tukde-tukde gang! 🤣"},b:{text:"1 bada paragraph essay 📝",icon:"📜",isCorrect:false,meme:"Itna kaun type karta hai?! 💀"}},
 {q:"Phone ki battery 1% bachi ho tab kya hota hai?",a:{text:"Aakhri saans tak reels dekhna 📱",icon:"🔋",isCorrect:true,meme:"Khatron ke khiladi! ⚡"},b:{text:"Dhang se phone side me rakhna 😴",icon:"🔌",isCorrect:false,meme:"Itna seedha koi nahi hota! 😆"}},
 {q:"Raat ko 2 baje achanak kya yaad aata hai?",a:{text:"2-Minute Maggi banao! 🍜",icon:"😋",isCorrect:true,meme:"Midnight chef mode ON! 🌙"},b:{text:"Kal subah jaldi uth ke padhna 📖",icon:"⏰",isCorrect:false,meme:"Sapne suhaane! 😴"}},
 {q:"Exam se theek ek raat pehle kya chalta hai?",a:{text:"One-Shot Video 2X speed pe 🚀",icon:"⏩",isCorrect:true,meme:"Topper banne ki ninja technique! 🧠"},b:{text:"Revision complete, so raha hu 💤",icon:"🛏️",isCorrect:false,meme:"Aisa jhooth pachta nahi! 🧢"}},
 {q:"Favorite sports energy kaun match karta hai?",a:{text:"Virat Kohli aggressive hype 🔥",icon:"🦁",isCorrect:true,meme:"King Kohli Roar! 18 Forever 👑"},b:{text:"Aalsi Sunday cricket 🥱",icon:"🛋️",isCorrect:false,meme:"Utho anarkali! 😂"}},
 {q:"Dost ne party maangi toh immediate reaction?",a:{text:"'Ghar aake paise le lena' (Liar) 🏃",icon:"💸",isCorrect:false,meme:"Bhagoda dost spotted! 🏃‍♂️"},b:{text:"'Chalti kya chai peene?' ☕",icon:"🤝",isCorrect:true,meme:"Chai is emotion! 🫖"}},
 {q:"Mobile game haarne ke baad pehla bahana?",a:{text:"Ping high tha aur lag ho raha tha! 📶",icon:"🤬",isCorrect:true,meme:"Classic gamer bahana! 🎮"},b:{text:"Saamne wala better khela 👍",icon:"🫡",isCorrect:false,meme:"Yeh ho hi nahi sakta! 🤡"}},
 {q:"Street food me momos ke sath kya compulsory hai?",a:{text:"Extra teekhi red chutney 🔥",icon:"🌶️",isCorrect:true,meme:"Pet dard pakka! 😂"},b:{text:"Sirf mayonnaise 🥛",icon:"🥟",isCorrect:false,meme:"Bina mirchi momo kaisa? ❌"}},
 {q:"Dost ka secret pata chalne par?",a:{text:"Lifetime blackmail material mil gaya 😈",icon:"🕵️",isCorrect:true,meme:"Bhai ab treat deni padegi! 🤣"},b:{text:"Kissi ko nahi bataunga 🤐",icon:"😇",isCorrect:false,meme:"Dost ho ya sant? 😆"}},
 {q:"Subah 6 baje ka alarm bajne ke baad?",a:{text:"Snooze dabake 8 baje uthna ⏰",icon:"😴",isCorrect:true,meme:"Just 5 more minutes! 🛌"},b:{text:"Pehle ring pe jump karke uthna 🏃",icon:"🌅",isCorrect:false,meme:"Robo ho kya bhai? 🤖"}},
 {q:"Photo click karate waqt signature pose?",a:{text:"Candid banne ka pretend karna 📸",icon:"🕶️",isCorrect:true,meme:"Hero look chal raha hai! 🎬"},b:{text:"Passport size seedha khade rehna 🧍",icon:"📄",isCorrect:false,meme:"Aadhaar card update hai kya? 💀"}},
 {q:"Ice cream me all-time favorite treat?",a:{text:"Choco Cone 🍦",icon:"🍫",isCorrect:true,meme:"End wali chocolate best! 🤤"},b:{text:"Karela flavor 🥒",icon:"🤢",isCorrect:false,meme:"Ye kaun khata hai bhai?! 🤮"}},
 {q:"Jab ghar wale bolte hain 'Market se sabzi le aa'?",a:{text:"Achanak se padhai ka bahana 📚",icon:"🏃‍♂️",isCorrect:true,meme:"Padhai ki izzat achanak badh gayi! 🤣"},b:{text:"Khushi khushi bag leke jana 🛍️",icon:"🚲",isCorrect:false,meme:"Aadarsh baalak! 😇"}},
 {q:"Free time me phone par kya chalta hai?",a:{text:"Brainrot memes & funny reels 🤣",icon:"📱",isCorrect:true,meme:"Dopamine full high! 🚀"},b:{text:"Dictionary padhna 📖",icon:"🧐",isCorrect:false,meme:"Kya baat hai Shakespeare! 🎭"}},
 {q:"Final Verdict: Kya mujhe block karna chahiye?",a:{text:"Block mat kar, tu mera best dost hai! 💖",icon:"🥺",isCorrect:true,meme:"Bach gaya tu! Dosti zindabad 🫂"},b:{text:"Haan seedha block list me daal! 🚫",icon:"😈",isCorrect:false,meme:"Moye Moye ho gaya tumhara! 😭"}}
];
let audioEnabled=true, audioCtx=null, currentIndex=0, score=0, answerGiven=false;
const mascotFaces=['🐻','🐼','😎','😜','🦁','🥳','👀','🤫'];
function initAudio(){if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended') audioCtx.resume();}
function playTone(freq,type='sine',duration=.25,volume=.2,delay=0){if(!audioEnabled)return;initAudio();const osc=audioCtx.createOscillator(),gain=audioCtx.createGain(),st=audioCtx.currentTime+delay;osc.type=type;osc.frequency.setValueAtTime(freq,st);gain.gain.setValueAtTime(volume,st);gain.gain.exponentialRampToValueAtTime(.001,st+duration);osc.connect(gain);gain.connect(audioCtx.destination);osc.start(st);osc.stop(st+duration+.02);}
function playVineBoom(){playTone(130,'sine',.65,1);if(audioEnabled&&audioCtx){const osc=audioCtx.createOscillator(),gain=audioCtx.createGain(),now=audioCtx.currentTime;osc.type='sine';osc.frequency.setValueAtTime(130,now);osc.frequency.exponentialRampToValueAtTime(28,now+.6);gain.gain.setValueAtTime(.7,now);gain.gain.exponentialRampToValueAtTime(.001,now+.65);osc.connect(gain);gain.connect(audioCtx.destination);osc.start(now);osc.stop(now+.65);}}
function playCheerChime(){[523.25,659.25,783.99,1046.5].forEach((f,i)=>playTone(f,'triangle',.3,.2,i*.08));}
function playMoyeMoyeSadMelody(){[440,415.3,370,329.6,277.2].forEach((f,i)=>playTone(f,'sawtooth',.35,.12,i*.22));}
function playVictoryKohliFanfare(){[523.25,659.25,783.99,1046.5,880,1046.5].forEach((f,i)=>playTone(f,'square',.4,.15,i*.12));}
function toggleAudio(){audioEnabled=!audioEnabled;document.getElementById('soundToggle').innerHTML=audioEnabled?'🔊 Sound: ON':'🔇 Sound: OFF';}
function renderProgress(){const bar=document.getElementById('progressBar');bar.innerHTML='';quizData.forEach((q,i)=>{const p=document.createElement('div');p.className='pill'+(i===currentIndex?' active':'')+(q._result===true?' correct':q._result===false?' wrong':'');p.textContent=i+1;bar.appendChild(p);});const active=bar.children[currentIndex];if(active)active.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});}
function renderQuestion(){answerGiven=false;const q=quizData[currentIndex];document.getElementById('questionBadge').textContent=`Question ${currentIndex+1} / ${quizData.length}`;document.getElementById('questionText').textContent=q.q;document.getElementById('mascotFace').textContent=mascotFaces[currentIndex%mascotFaces.length];renderProgress();const container=document.getElementById('optionsContainer');container.innerHTML='';['a','b'].forEach(key=>{const opt=q[key],card=document.createElement('button');card.type='button';card.className='option-card';card.innerHTML=`<span class="opt-icon">${opt.icon}</span><span class="opt-label"></span>`;card.querySelector('.opt-label').textContent=opt.text;card.addEventListener('click',()=>chooseAnswer(key,card));container.appendChild(card);});}
function showMeme(message){const el=document.getElementById('memeAlert');el.textContent=message;el.style.display='block';el.style.animation='none';void el.offsetWidth;el.style.animation='popMeme .8s ease forwards';setTimeout(()=>el.style.display='none',850);}
function chooseAnswer(key,card){if(answerGiven)return;answerGiven=true;const q=quizData[currentIndex],opt=q[key];q._result=!!opt.isCorrect;if(opt.isCorrect){score++;card.classList.add('chosen-correct');playCheerChime();}else{card.classList.add('chosen-wrong');playVineBoom();}showMeme(opt.meme);document.querySelectorAll('.option-card').forEach(c=>c.disabled=true);setTimeout(()=>{currentIndex++;if(currentIndex<quizData.length)renderQuestion();else showResults();},950);}
function showResults(){document.getElementById('quizScreen').style.display='none';document.getElementById('resultScreen').style.display='block';document.getElementById('finalScoreVal').textContent=score;let title,desc,emoji;if(score>=15){title='King Kohli Level! 👑';desc='Bhai, teri vibe toh legend wali hai! #18 energy full power.';emoji='🏆';playVictoryKohliFanfare();}else if(score>=10){title='Solid Dost! 😎';desc='Teri vibe mast hai! Dosti aur memes dono on point.';emoji='😎';playCheerChime();}else{title='Quiz Rookie! 😂';desc='Bhai, ek aur round khel aur apni asli vibe dikha!';emoji='🤣';playMoyeMoyeSadMelody();}document.getElementById('verdictHeading').textContent=title;document.getElementById('verdictText').textContent=desc;document.getElementById('resultEmoji').textContent=emoji;}
function shareOnWhatsApp(){const title=document.getElementById('verdictHeading').textContent;const msg=`🏏 Don't Block Me Quiz — King Kohli #18 Special!\nMy score: ${score}/18\n${title}\nCan you beat my score?`;window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank');}
function restartQuiz(){currentIndex=0;score=0;quizData.forEach(q=>delete q._result);document.getElementById('resultScreen').style.display='none';document.getElementById('quizScreen').style.display='block';renderQuestion();}
renderQuestion();
</script>
</body>
</html>
